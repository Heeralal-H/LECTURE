services:
  - type: web
    name: lecture2learning
    env: docker
    rootDir: .
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    envVars:
      - key: PORT
        value: 8000
      - key: DATABASE_URL
        value: sqlite:////data/lecture2learning.db
      - key: UPLOAD_DIR
        value: /data/uploads
      - key: MAX_UPLOAD_MB
        value: 20
    disk:
      name: data
      mountPath: /data
      sizeGB: 1
